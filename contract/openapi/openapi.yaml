          type: string
          examples:
            - prm_1
        text:
          type: string
          examples:
            - apple
        status:
          $ref: "#/components/schemas/PromptStatus"
        score:
          oneOf:
            - $ref: "#/components/schemas/Score"
            - type: "null"
        feedback:
          oneOf:
            - type: string
              examples:
                - The Guard yawns...
            - type: "null"
        receivedAt:
          $ref: "#/components/schemas/Timestamp"
      description: "`score` and `feedback` are null until the prompt is scored."
    PlayerSelf:
      type: object
      required:
        - id
        - slotNumber
        - label
        - shape
        - state
      properties:
