        label:
          $ref: "#/components/schemas/Label"
        shape:
          $ref: "#/components/schemas/Shape"
        connection:
          $ref: "#/components/schemas/Connection"
        state:
          $ref: "#/components/schemas/PlayerState"
      description: One entry of the public player list (API 23 `players`).
    PlayerView:
      type: object
      required:
        - serverNow
        - player
        - session
        - players
        - treasure
        - round
        - prompts
        - canSubmit
      properties:
        serverNow:
          $ref: "#/components/schemas/Timestamp"
        player:
          type: object
          required:
            - id
            - slotNumber
            - label
            - shape
            - state
            - bestScore
          properties:
            id:
              type: string
              examples:
                - ply_1
            slotNumber:
              $ref: "#/components/schemas/SlotNumber"
            label:
              $ref: "#/components/schemas/Label"
            shape:
              $ref: "#/components/schemas/Shape"
            state:
              $ref: "#/components/schemas/PlayerState"
            bestScore:
              oneOf:
                - $ref: "#/components/schemas/Score"
                - type: "null"
        session:
          type: object
          required:
            - id
            - phase
            - capacity
            - joinedCount
          properties:
            id:
              type: string
              examples:
                - ses_01
            phase:
              $ref: "#/components/schemas/Phase"
            capacity:
              type: integer
              examples:
                - 5
            joinedCount:
              type: integer
              examples:
                - 5
        players:
          type: array
          items:
            $ref: "#/components/schemas/PublicPlayer"
          description: Empty until `players:revealed`, then every player at once (D16). Never contains unapproved names.
        treasure:
          oneOf:
            - $ref: "#/components/schemas/Treasure"
            - type: "null"
        round:
          oneOf:
            - type: object
              required:
