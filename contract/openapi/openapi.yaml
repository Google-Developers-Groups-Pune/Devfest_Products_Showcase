                    - type: "null"
                expression:
                  $ref: "#/components/schemas/Expression"
            - type: "null"
      description: "`latest` is the latest approved prompt only."
    ProvisionalResult:
      type: object
      additionalProperties: false
      required:
        - roundId
        - winner
      properties:
        roundId:
          type: string
          examples:
            - rnd_1
        winner:
          oneOf:
            - $ref: "#/components/schemas/Winner"
            - type: "null"
          description: null when nobody scored (API 12).
      description: Provisional winner (BE-24). Payload of `result:provisional`, and `DisplayState.result` in `RESULT_PENDING`.
    ConfirmedResult:
      type: object
      required:
        - roundId
        - roundNumber
        - winner
        - ranking
        - tieBreakExplanation
      properties:
        roundId:
          type: string
          examples:
            - rnd_1
        roundNumber:
          type: integer
          examples:
            - 1
        winner:
          $ref: "#/components/schemas/Winner"
        ranking:
          type: array
          items:
            $ref: "#/components/schemas/PublicRankingEntry"
          description: Same rows as API 26 `ranking`.
        tieBreakExplanation:
          oneOf:
            - type: string
            - type: "null"
      description: >-
        Confirmed result (BE-25). Payload of `result:confirmed`, and `DisplayState.result` in `RESULTS`. `winner` is never
        null, because a round with no winner cannot be confirmed (`409 NO_WINNER`).
    DisplayState:
      type: object
      required:
        - serverNow
        - phase
        - joinUrl
        - session
        - players
        - treasure
        - round
        - unlocked
        - result
      properties:
        serverNow:
          $ref: "#/components/schemas/Timestamp"
        phase:
          $ref: "#/components/schemas/Phase"
        joinUrl:
          type: string
          examples:
            - heist.devfestpune.dev
        session:
          oneOf:
            - type: object
              required:
                - capacity
                - joinedCount
              properties:
                capacity:
                  type: integer
                  examples:
                    - 5
                joinedCount:
                  type: integer
                  examples:
                    - 5
            - type: "null"
        players:
          type: array
          items:
            $ref: "#/components/schemas/DisplayPlayer"
          description: >-
            Empty until `players:revealed`, then every player at once (D16). Before that the screen shows
            `session.joinedCount` only.
        treasure:
          oneOf:
            - $ref: "#/components/schemas/Treasure"
            - type: "null"
        round:
          oneOf:
            - type: object
              required:
                - roundId
                - roundNumber
                - durationSeconds
                - roundEndAt
              properties:
                roundId:
                  type: string
                  examples:
                    - rnd_1
                roundNumber:
                  type: integer
                  examples:
                    - 1
                durationSeconds:
                  type: integer
                  examples:
                    - 90
                roundEndAt:
                  $ref: "#/components/schemas/Timestamp"
            - type: "null"
        unlocked:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        result:
          oneOf:
            - $ref: "#/components/schemas/ProvisionalResult"
            - $ref: "#/components/schemas/ConfirmedResult"
            - type: "null"
          description: >-
            `ProvisionalResult` in `RESULT_PENDING`, `ConfirmedResult` in `RESULTS`, otherwise null. Same shapes as the
            `result:provisional` and `result:confirmed` socket events, so one parser serves hydrate and live updates.
      description: "`session` is null when phase is `SETUP` (no session open)."
