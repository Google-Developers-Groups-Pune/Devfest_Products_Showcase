                - roundNumber
                - durationSeconds
                - startedAt
                - roundEndAt
              properties:
                roundId:
                  type: string
                  examples:
                    - rnd_1
                roundNumber:
                  type: integer
                  examples:
                    - 1
                durationSeconds:
                  type: integer
                  examples:
                    - 90
                startedAt:
                  $ref: "#/components/schemas/Timestamp"
                roundEndAt:
                  $ref: "#/components/schemas/Timestamp"
            - type: "null"
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/PlayerPrompt"
        canSubmit:
          type: boolean
    DisplayPlayer:
      type: object
      required:
        - slotNumber
        - label
        - shape
        - connection
        - state
        - bestScore
        - latest
      properties:
        slotNumber:
          $ref: "#/components/schemas/SlotNumber"
        label:
          $ref: "#/components/schemas/Label"
        shape:
          $ref: "#/components/schemas/Shape"
        connection:
