openapi: 3.1.0
info:
  title: Prompt Heist API
  version: 0.1.0
  description: |
    REST contract for the Prompt Heist backend. BE-02 extends this file to all 30
    endpoints listed in docs/STORIES.md section 9, including error codes.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local backend
  - url: http://localhost:4010
    description: Prism mock server
tags:
  - name: health
    description: Service liveness.
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The service is up.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  headers:
    CorrelationId:
      description: Returned on every response.
      schema:
        type: string
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              examples: [ROUND_EXPIRED]
            message:
              type: string
              description: Safe text for the user.
            correlationId:
              type: string
