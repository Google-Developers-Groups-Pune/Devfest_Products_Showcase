  /api/controller/sessions/{id}/close:
    post:
      operationId: closeSession
      summary: API 28 · Close or abandon a session
      description: >-
        Closes the session without opening another. Two uses:


        - Abandon, from `JOINING`, `TREASURE_REVIEW` or `READY`: `reason` is required (D31), otherwise
        `422 REASON_REQUIRED`. Releases entrance IDs, so those people can join a later session.

        - End session, from `RESULTS`, for the last group of the day (D45): no `reason` needed.


        Any other phase returns `409 INVALID_PHASE`. Emits `session:closed`, then revokes player tokens (D30).
      tags:
        - Controller
      x-api: 28
      x-owner:
        story: BE-36
        engineer: Asmita
      security:
        - controllerToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Session ID.
          schema:
            type: string
          example: ses_01
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                reason:
                  type: string
                  examples:
                    - Only 3 players turned up
                  description: Required when abandoning (`JOINING`, `TREASURE_REVIEW`, `READY`). Not needed from `RESULTS`.
      responses:
        "200":
          description: Closed.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                properties:
                  session:
                    type: object
                    required:
                      - id
                      - phase
                    properties:
                      id:
                        type: string
                        examples:
                          - ses_01
                      phase:
                        $ref: "#/components/schemas/Phase"
                        examples:
                          - CLOSED
              example:
                session:
                  id: ses_01
                  phase: CLOSED
        "400":
          description: "`BAD_REQUEST`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
