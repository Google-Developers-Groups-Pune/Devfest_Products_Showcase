          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_PHASE:
                  $ref: "#/components/examples/INVALID_PHASE"
                EVENT_CLOSING_FAILED:
                  $ref: "#/components/examples/EVENT_CLOSING_FAILED"
        "413":
          description: "`PAYLOAD_TOO_LARGE`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                PAYLOAD_TOO_LARGE:
                  $ref: "#/components/examples/PAYLOAD_TOO_LARGE"
        "422":
          description: "`REASON_REQUIRED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                REASON_REQUIRED:
                  $ref: "#/components/examples/REASON_REQUIRED"
  /api/controller/sessions/{id}/next-group:
    post:
      operationId: nextGroup
      summary: API 29 · Next group
      description: |-
        In one transaction: closes the session and opens a fresh one with the same capacity and duration (D2, D45).
        Allowed from `RESULTS` only. No request body. Replaying the same `Idempotency-Key` returns the same new session.
      tags:
        - Controller
      x-api: 29
      x-owner:
        story: BE-36
        engineer: Asmita
      security:
        - controllerToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Session ID.
          schema:
            type: string
          example: ses_01
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: New session opened.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                type: object
                required:
                  - closedSessionId
                  - session
                  - slots
                properties:
                  closedSessionId:
                    type: string
                    examples:
                      - ses_01
                  session:
                    $ref: "#/components/schemas/ActiveSession"
                  slots:
                    type: array
                    items:
                      $ref: "#/components/schemas/ControllerSlot"
              example:
                closedSessionId: ses_01
                session:
                  id: ses_02
                  phase: JOINING
                  capacity: 5
                  roundDurationSeconds: 90
                  joinedCount: 0
                slots:
                  - slotNumber: 1
                    code: "41"
                    shape: BLUE_CIRCLE
                    slotState: UNJOINED
                    player: null
        "400":
          description: "`IDEMPOTENCY_KEY_REQUIRED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                IDEMPOTENCY_KEY_REQUIRED:
                  $ref: "#/components/examples/IDEMPOTENCY_KEY_REQUIRED"
        "401":
          description: "`UNAUTHENTICATED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  $ref: "#/components/examples/UNAUTHENTICATED"
        "409":
          description: "`INVALID_PHASE` · `EVENT_CLOSING_FAILED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_PHASE:
                  $ref: "#/components/examples/INVALID_PHASE"
                EVENT_CLOSING_FAILED:
                  $ref: "#/components/examples/EVENT_CLOSING_FAILED"
  /api/controller/players/{id}/name-review:
    post:
      operationId: reviewPlayerName
      summary: API 30 · Review a player name
      description: >-
        Approve a name, or reject it with a replacement typed by the Controller (D16). A replacement changes the name
        everywhere,

        including the CSV, and goes through the same label collision rule as join. When the last name is approved,
        `players:revealed` is emitted.
      tags:
        - Controller
      x-api: 30
      x-owner:
        story: BE-39
        engineer: Shreya
      security:
        - controllerToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Player ID.
          schema:
            type: string
          example: ply_1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - decision
                  properties:
                    decision:
                      const: APPROVED
                - type: object
                  required:
                    - decision
                    - fullName
                  properties:
                    decision:
                      const: RENAMED
                    fullName:
                      type: string
                      examples:
                        - Aman Sharma
      responses:
        "200":
          description: Reviewed.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                type: object
                required:
                  - player
                  - allApproved
                properties:
                  player:
                    type: object
                    required:
                      - id
                      - label
                      - nameReview
                    properties:
                      id:
                        type: string
                        examples:
                          - ply_1
                      label:
                        $ref: "#/components/schemas/Label"
                      nameReview:
                        $ref: "#/components/schemas/NameReview"
                  allApproved:
                    type: boolean
              example:
                player:
                  id: ply_1
                  label: Aman
                  nameReview: APPROVED
                allApproved: false
        "400":
          description: "`BAD_REQUEST`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                BAD_REQUEST:
                  $ref: "#/components/examples/BAD_REQUEST"
        "401":
          description: "`UNAUTHENTICATED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  $ref: "#/components/examples/UNAUTHENTICATED"
        "404":
          description: "`NOT_FOUND`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                NOT_FOUND:
                  $ref: "#/components/examples/NOT_FOUND"
        "409":
          description: "`INVALID_PHASE` · `EVENT_CLOSING_FAILED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_PHASE:
                  $ref: "#/components/examples/INVALID_PHASE"
                EVENT_CLOSING_FAILED:
                  $ref: "#/components/examples/EVENT_CLOSING_FAILED"
        "413":
          description: "`PAYLOAD_TOO_LARGE`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                PAYLOAD_TOO_LARGE:
                  $ref: "#/components/examples/PAYLOAD_TOO_LARGE"
        "422":
          description: "`NAME_REQUIRED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                NAME_REQUIRED:
                  $ref: "#/components/examples/NAME_REQUIRED"
components:
  securitySchemes:
    controllerToken:
      type: http
      scheme: bearer
      description: "`controllerToken`, valid for 12 hours. Logout revokes it."
    joinToken:
      type: http
      scheme: bearer
      description: "`joinToken`, valid for 5 minutes. Issued by API 20, used by API 21."
    playerToken:
      type: http
      scheme: bearer
      description: "`playerToken`, valid until the session closes or the player rejoins elsewhere."
  headers:
    X-Correlation-Id:
      description: Present on every response. Matches `error.correlationId` on errors.
      required: true
      schema:
        type: string
      example: corr_example
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required. Reuse the same key on a retry.
      schema:
        type: string
        format: uuid
      example: 3f1c2a9e-8b4d-4c1e-9a7f-2d5e6b8c0a11
  schemas:
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC with milliseconds.
      examples:
        - "2026-12-05T10:00:00.000Z"
    Score:
      type: integer
      minimum: 0
      maximum: 100
      description: "Integer 0 to 100. Colours: 0–39 red, 40–79 yellow, 80–99 blue, 100 green."
    SlotNumber:
      type: integer
      minimum: 1
      maximum: 5
    Label:
      type: string
      description: "Public label: the first name, with \"(Player N)\" added on a first-name collision. Never the full name."
      examples:
        - Dev
    Phase:
      type: string
      description: Session phase. `SETUP` means no session is open.
      enum:
        - SETUP
        - JOINING
        - TREASURE_REVIEW
        - READY
        - PLAYING
        - RESULT_PENDING
        - RESULTS
        - DISCARDED
        - CLOSED
    PlayerState:
      type: string
      enum:
        - LOBBY
        - PLAYING
        - LOCKED_100
        - RESULT_PENDING
        - COMPLETE
    Connection:
      type: string
      enum:
        - CONNECTED
        - DISCONNECTED
    SlotState:
      type: string
      description: Controller view of a slot.
      enum:
        - UNJOINED
        - LOBBY
        - PLAYING
        - LOCKED_100
        - DISCONNECTED
        - RESULT_PENDING
        - COMPLETE
    PromptStatus:
      type: string
      enum:
        - RECEIVED
        - FILTERING
        - BLOCKED
        - APPROVED
        - SCORING
        - SCORED
        - FAILED
        - DISPLAYED
    EventStatus:
      type: string
      enum:
        - OPEN
        - CLOSING
        - CLOSED
        - CLOSING_FAILED
    Shape:
      type: string
      description: Colour marker, fixed by slot.
      enum:
        - BLUE_CIRCLE
        - RED_SQUARE
        - YELLOW_DIAMOND
        - GREEN_PILL
        - GREEN_CIRCLE
      x-by-slot:
        "1": BLUE_CIRCLE
        "2": RED_SQUARE
        "3": YELLOW_DIAMOND
        "4": GREEN_PILL
        "5": GREEN_CIRCLE
    ResultStatus:
      type: string
      description: API 12 (BE-24).
      enum:
        - PROVISIONAL
        - CONFIRMED
    NameReview:
      type: string
      description: BE-08, BE-39.
      enum:
        - PENDING
        - APPROVED
    CandidateStatus:
      type: string
      description: Treasure candidate status (BE-19). The internal blocked state is never exposed.
      enum:
        - GENERATING
        - READY
        - FAILED
        - APPROVED
        - REJECTED
    AgentStatus:
      type: string
      description: API 18 (BE-14).
      enum:
        - UP
        - DOWN
    Expression:
      type: string
      description: "Emoji face (BE-18). Starting list: the final list comes from FE-31. `NEUTRAL` when the reaction failed (D49)."
      enum:
        - NEUTRAL
        - BORED
        - UNIMPRESSED
        - CURIOUS
        - IMPRESSED
        - SHOCKED
        - SALUTE
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - correlationId
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              examples:
                - Safe text for the user
            correlationId:
              type: string
              examples:
                - corr_example
    ControllerAccount:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
          examples:
            - ctl_1
        username:
          type: string
          examples:
            - controller
    LoginResponse:
      type: object
      required:
        - token
        - expiresAt
        - controller
      properties:
        token:
          type: string
          examples:
            - <controllerToken>
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        controller:
          $ref: "#/components/schemas/ControllerAccount"
    NewSession:
      type: object
      required:
        - id
        - phase
        - capacity
        - roundDurationSeconds
        - joinedCount
        - createdAt
      properties:
        id:
          type: string
          examples:
            - ses_01
        phase:
          $ref: "#/components/schemas/Phase"
          examples:
            - JOINING
        capacity:
          type: integer
          examples:
            - 5
        roundDurationSeconds:
          type: integer
          examples:
            - 90
        joinedCount:
          type: integer
          examples:
            - 0
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    ActiveSession:
      type: object
      required:
        - id
        - phase
        - capacity
        - roundDurationSeconds
        - joinedCount
      properties:
        id:
          type: string
          examples:
            - ses_01
        phase:
          $ref: "#/components/schemas/Phase"
          examples:
            - JOINING
        capacity:
          type: integer
          examples:
            - 5
        roundDurationSeconds:
          type: integer
          examples:
            - 90
        joinedCount:
          type: integer
          examples:
            - 0
    ControllerSlot:
      type: object
      required:
        - slotNumber
        - code
        - shape
        - slotState
        - player
      properties:
        slotNumber:
          $ref: "#/components/schemas/SlotNumber"
        code:
          type: string
          examples:
            - "29"
          pattern: ^[0-9]{2}$
          description: 2-digit booth code, unique within the session.
        shape:
          $ref: "#/components/schemas/Shape"
        slotState:
          $ref: "#/components/schemas/SlotState"
        player:
          oneOf:
            - $ref: "#/components/schemas/ControllerSlotPlayer"
            - type: "null"
    ControllerSlotPlayer:
      type: object
      required:
        - id
        - label
        - fullName
        - entranceId
        - connection
        - bestScore
        - nameReview
      properties:
        id:
          type: string
          examples:
            - ply_1
        label:
          $ref: "#/components/schemas/Label"
        fullName:
          type: string
          examples:
            - Neha Rao
        entranceId:
          type: string
          examples:
            - DF-2026-2802
        connection:
          $ref: "#/components/schemas/Connection"
        bestScore:
          oneOf:
            - $ref: "#/components/schemas/Score"
            - type: "null"
        nameReview:
          $ref: "#/components/schemas/NameReview"
      description: Controller only. Contains fullName and entranceId.
    ControllerDashboard:
      type: object
      required:
        - serverNow
        - eventDay
        - session
        - slots
        - audit
      properties:
        serverNow:
          $ref: "#/components/schemas/Timestamp"
        eventDay:
          type: object
          required:
            - id
            - status
            - confirmedCount
            - csvExportedAt
            - csvUpToDate
            - lastSettings
            - winners
          properties:
            id:
              type: string
              examples:
                - evt_01
            status:
              $ref: "#/components/schemas/EventStatus"
            confirmedCount:
              type: integer
              examples:
                - 1
            csvExportedAt:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            csvUpToDate:
              type: boolean
            lastSettings:
              oneOf:
                - type: object
                  required:
                    - capacity
                    - roundDurationSeconds
                  properties:
                    capacity:
                      type: integer
                      examples:
                        - 5
                    roundDurationSeconds:
                      type: integer
                      examples:
                        - 90
                - type: "null"
            winners:
              type: array
              items:
                type: object
                required:
                  - roundNumber
                  - fullName
                  - score
                properties:
                  roundNumber:
                    type: integer
                    examples:
                      - 1
                  fullName:
                    type: string
                    examples:
                      - Dev Khan
                  score:
                    $ref: "#/components/schemas/Score"
        session:
          oneOf:
            - $ref: "#/components/schemas/ActiveSession"
            - type: "null"
        slots:
          type: array
          items:
            $ref: "#/components/schemas/ControllerSlot"
        treasure:
          oneOf:
            - $ref: "#/components/schemas/ControllerTreasure"
            - type: "null"
        round:
          oneOf:
            - type: object
              required:
                - roundId
                - roundNumber
                - durationSeconds
                - startedAt
                - roundEndAt
              properties:
                roundId:
                  type: string
                  examples:
                    - rnd_1
                roundNumber:
                  type: integer
                  examples:
                    - 1
                durationSeconds:
                  type: integer
                  examples:
                    - 90
                startedAt:
                  oneOf:
                    - $ref: "#/components/schemas/Timestamp"
                    - type: "null"
                roundEndAt:
                  oneOf:
                    - $ref: "#/components/schemas/Timestamp"
                    - type: "null"
            - type: "null"
        audit:
          type: array
          items:
            type: object
            required:
              - at
              - summary
            properties:
              at:
                $ref: "#/components/schemas/Timestamp"
              summary:
                type: string
                examples:
                  - Session opened - 5 players - 90s round
      description: "`treasure` and `round` are null until the session has one."
    CandidateRef:
      type: object
      required:
        - candidateId
        - status
      properties:
        candidateId:
          type: string
          examples:
            - cnd_1
        status:
          $ref: "#/components/schemas/CandidateStatus"
          examples:
            - GENERATING
    Rubric:
      type: object
      required:
        - version
        - scoringCriteria
      properties:
        version:
          type: string
          examples:
            - v1
        scoringCriteria:
          type: array
          items:
            type: string
          examples:
            - - Requests a poem
              - Exactly three lines
      description: "Hidden rubric. Controller only: must never reach a phone or the display."
    ControllerTreasure:
      type: object
      required:
        - candidateId
        - status
        - title
        - backstory
        - lockObjective
        - imageUrl
        - filterPassed
        - rubric
      properties:
        candidateId:
          type: string
          examples:
            - cnd_1
        status:
          $ref: "#/components/schemas/CandidateStatus"
        title:
          type: string
          examples:
            - The Saffron Vault
        backstory:
          type: string
        lockObjective:
          type: string
        imageUrl:
          type: string
          format: uri
          examples:
            - https://storage.googleapis.com/...
        filterPassed:
          type: boolean
        rubric:
          $ref: "#/components/schemas/Rubric"
      description: Controller view of the treasure, including the rubric.
    Treasure:
      type: object
      required:
        - treasureId
        - title
        - backstory
        - lockObjective
        - imageUrl
      properties:
        treasureId:
          type: string
          examples:
            - cnd_1
        title:
          type: string
          examples:
            - The Golden Mango of Eternal Juiciness
        backstory:
          type: string
          examples:
            - Barnaby the flamingo guard hates his job and is severely underpaid in shrimp.
        lockObjective:
          type: string
          examples:
            - Convince Barnaby the Flamingo Guard to unlock the Golden Mango.
        imageUrl:
          type: string
          format: uri
          examples:
            - https://storage.example.com/treasures/cnd_1.png?signature=abc
          description: Signed URL, valid for 4 hours.
      description: Public treasure card (players and display). Never includes the rubric.
    Round:
      type: object
      required:
        - roundId
        - roundNumber
        - durationSeconds
        - startedAt
        - roundEndAt
        - serverNow
      properties:
        roundId:
          type: string
          examples:
            - rnd_1
        roundNumber:
          type: integer
          examples:
            - 1
          description: Counts confirmed sessions only (D35).
        durationSeconds:
          type: integer
          examples:
            - 90
        startedAt:
          $ref: "#/components/schemas/Timestamp"
        roundEndAt:
          $ref: "#/components/schemas/Timestamp"
        serverNow:
          $ref: "#/components/schemas/Timestamp"
    Winner:
      type: object
      required:
        - slotNumber
        - label
        - shape
        - bestScore
      properties:
        slotNumber:
          $ref: "#/components/schemas/SlotNumber"
        label:
          $ref: "#/components/schemas/Label"
        shape:
          $ref: "#/components/schemas/Shape"
        bestScore:
          $ref: "#/components/schemas/Score"
    RankingEntry:
      type: object
      required:
        - rank
        - playerId
        - slotNumber
        - label
        - shape
        - bestScore
      properties:
        rank:
          type: integer
          examples:
            - 1
          minimum: 1
        playerId:
          type: string
          examples:
            - ply_2
        slotNumber:
          $ref: "#/components/schemas/SlotNumber"
        label:
          $ref: "#/components/schemas/Label"
        shape:
          $ref: "#/components/schemas/Shape"
        bestScore:
          oneOf:
            - $ref: "#/components/schemas/Score"
            - type: "null"
        decidingSubmissionId:
          type: string
          examples:
            - prm_19
        decidingSequence:
          type: integer
          examples:
            - 19
        decidingReceivedAt:
          $ref: "#/components/schemas/Timestamp"
      description: >-
        Controller ranking row (API 12). The `deciding*` fields are omitted for a player with no score.
    RoundResult:
      type: object
      required:
        - status
        - winner
        - ranking
        - canConfirm
      properties:
        status:
          $ref: "#/components/schemas/ResultStatus"
        winner:
          oneOf:
            - $ref: "#/components/schemas/Winner"
            - type: "null"
        ranking:
          type: array
          items:
            $ref: "#/components/schemas/RankingEntry"
        tieBreakExplanation:
          type:
            - string
            - "null"
          examples:
            - "Tie on 100. Dev reached it first (submission #19 before #32)."
        canConfirm:
          type: boolean
    PublicRankingEntry:
      type: object
      required:
        - rank
        - slotNumber
        - label
        - shape
        - bestScore
      properties:
        rank:
          type: integer
          examples:
            - 1
          minimum: 1
        slotNumber:
          $ref: "#/components/schemas/SlotNumber"
        label:
          $ref: "#/components/schemas/Label"
        shape:
          $ref: "#/components/schemas/Shape"
        bestScore:
          oneOf:
            - $ref: "#/components/schemas/Score"
            - type: "null"
      description: Public ranking row (API 26), with no player ID.
    PlayerResultConfirmed:
      type: object
      required:
        - status
        - roundNumber
        - myRank
        - winner
        - ranking
        - tieBreakExplanation
        - story
      properties:
        status:
          const: CONFIRMED
        roundNumber:
          type: integer
          examples:
            - 2
        myRank:
          type: integer
          examples:
            - 4
        winner:
          $ref: "#/components/schemas/Winner"
        ranking:
          type: array
          items:
            $ref: "#/components/schemas/PublicRankingEntry"
        tieBreakExplanation:
          oneOf:
            - type: string
            - type: "null"
        story:
          type: object
          required:
            - title
            - backstory
            - imageUrl
          properties:
            title:
              type: string
              examples:
                - The Golden Chai Cup
            backstory:
              type: string
            imageUrl:
              type: string
              format: uri
    PromptReceipt:
      type: object
      required:
        - promptId
        - status
        - sequence
        - receivedAt
      properties:
        promptId:
          type: string
          examples:
            - prm_1
        status:
          $ref: "#/components/schemas/PromptStatus"
