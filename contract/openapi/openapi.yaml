# Prompt Heist REST API (OpenAPI 3.1)
# Contract for BE-02. Keep in sync with the story files.

openapi: 3.1.0
info:
  title: Prompt Heist API
  version: 0.3.0
  summary: REST contract for the Prompt Heist game (BE-02).
  license:
    name: MIT
    identifier: MIT
  description: >-
    Sources: the story files in `docs/team/` (Shravani.md) and the teammates' story files (Asmita.md, Shreya.md),

    cross-checked with the frontend story files (Mrudula.md, Harsimar.md). Each endpoint names its owner story in
    `x-owner`.


    Conventions (shared contract):

    - JSON, camelCase. Timestamps are ISO 8601 UTC with milliseconds. Durations are whole seconds.

    - `Authorization: Bearer <token>`. Every response has `X-Correlation-Id`.

    - The client never sends a player ID, score, timestamp or winner. The server works these out.

    - All writes go through REST. Sockets only send from server to client.

    - After any socket reconnect, call the hydrate endpoint (APIs 5, 23, 27).

    - While event closing has failed, every other Controller write returns `409 EVENT_CLOSING_FAILED` (BE-29).

    - Any endpoint can return `500 INTERNAL` for an unexpected server failure.

    - Routes that take a JSON body return `400 BAD_REQUEST` when the body cannot be read and `413 PAYLOAD_TOO_LARGE`
    when it is too large.

    - Player routes: `401 UNAUTHENTICATED` (token missing, invalid or expired) and `401 SESSION_CLOSED` clear the
    phone and return to the booth code screen. `401 TOKEN_SUPERSEDED` shows the kicked screen.

    - Names stay hidden from phones and the audience until `players:revealed` (D16): the public player lists are empty
    until then.


    Change rule: anyone changing this contract after Day 2 updates this file in the same PR and posts in the team
    channel.
servers:
  - url: http://localhost:8080
    description: Local backend
  - url: http://localhost:4010
    description: Local mock (`npm run mock` for Prism only, `npm run mock:game` for Prism plus the socket replay)
tags:
  - name: Health
    description: Service liveness, used by Cloud Run.
  - name: Controller
    description: Booth operator routes. Need `controllerToken`.
  - name: Player
    description: Phone routes. The player always comes from the token.
  - name: Display
    description: Public audience big-screen route. No token.
  - name: Hydrate
    description: Called on load and after any socket reconnect.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 while the service is up (BE-01). Not `/healthz`, which Cloud Run reserves.
      tags:
        - Health
      x-owner:
        story: BE-01
        engineer: Shreya
      security: []
      responses:
        "200":
          description: The service is up.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
              example:
                status: ok
  /api/controller/auth/login:
    post:
      operationId: controllerLogin
      summary: API 1 · Controller login
      description: >-
        One Controller account, username and password stored as an argon2 hash (D13). No second factor.

        A new login ends the previous one: the old token is revoked and `controller:kicked` goes to the old socket
        (D29).

        Limit of 5 tries per minute, never a long lockout.
      tags:
        - Controller
      x-api: 1
      x-owner:
        story: BE-05
        engineer: Asmita
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  examples:
                    - controller
                password:
                  type: string
                  examples:
                    - ...
      responses:
        "200":
          description: Logged in.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: <controllerToken>
                expiresAt: "2026-12-05T20:00:00.000Z"
                controller:
                  id: ctl_1
                  username: controller
        "400":
          description: "`BAD_REQUEST`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                BAD_REQUEST:
                  $ref: "#/components/examples/BAD_REQUEST"
        "401":
          description: "`INVALID_CREDENTIALS`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_CREDENTIALS:
                  $ref: "#/components/examples/INVALID_CREDENTIALS"
        "413":
          description: "`PAYLOAD_TOO_LARGE`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                PAYLOAD_TOO_LARGE:
                  $ref: "#/components/examples/PAYLOAD_TOO_LARGE"
        "429":
          description: "`TOO_MANY_ATTEMPTS`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                TOO_MANY_ATTEMPTS:
                  $ref: "#/components/examples/TOO_MANY_ATTEMPTS"
  /api/controller/auth/logout:
    post:
      operationId: controllerLogout
      summary: API 2 · Controller logout
      tags:
        - Controller
      x-api: 2
      x-owner:
        story: BE-05
        engineer: Asmita
      security:
        - controllerToken: []
      responses:
        "204":
          description: No body. The token is added to a server-side revoked list until it expires.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
        "401":
          description: "`UNAUTHENTICATED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  $ref: "#/components/examples/UNAUTHENTICATED"
  /api/controller/auth/me:
    get:
      operationId: controllerMe
      summary: API 3 · Current Controller
      tags:
        - Controller
      x-api: 3
      x-owner:
        story: BE-05
        engineer: Asmita
      security:
        - controllerToken: []
      responses:
        "200":
          description: The signed-in Controller.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                type: object
                required:
                  - controller
                properties:
                  controller:
                    $ref: "#/components/schemas/ControllerAccount"
              example:
                controller:
                  id: ctl_1
                  username: controller
        "401":
          description: "`UNAUTHENTICATED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  $ref: "#/components/examples/UNAUTHENTICATED"
  /api/controller/sessions:
    post:
      operationId: createSession
      summary: API 4 · Open a session
      description: >-
        Opens a new session and generates one unique 2-digit code per slot. Phase becomes `JOINING`.

        Creates the `EventDay` record on the first session of the day. Refuses a second session unless the current one
        is `CLOSED`.
      tags:
        - Controller
      x-api: 4
      x-owner:
        story: BE-08
        engineer: Asmita
      security:
        - controllerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - capacity
              properties:
                capacity:
                  type: integer
                  enum:
                    - 4
                    - 5
                  examples:
                    - 5
                roundDurationSeconds:
                  type: integer
                  examples:
                    - 90
                  minimum: 1
                  default: 90
                  description: Optional. Positive whole seconds, no maximum.
      responses:
        "201":
          description: Session opened.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                  - slots
                properties:
                  session:
                    $ref: "#/components/schemas/NewSession"
                  slots:
                    type: array
                    items:
                      $ref: "#/components/schemas/ControllerSlot"
              example:
                session:
                  id: ses_01
                  phase: JOINING
                  capacity: 5
                  roundDurationSeconds: 90
                  joinedCount: 0
                  createdAt: "2026-12-05T10:00:00.000Z"
                slots:
                  - slotNumber: 1
                    code: "29"
                    shape: BLUE_CIRCLE
                    slotState: UNJOINED
                    player: null
        "400":
          description: "`BAD_REQUEST`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                BAD_REQUEST:
                  $ref: "#/components/examples/BAD_REQUEST"
        "401":
          description: "`UNAUTHENTICATED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  $ref: "#/components/examples/UNAUTHENTICATED"
        "409":
          description: "`SESSION_ALREADY_ACTIVE` · `EVENT_CLOSED` · `EVENT_CLOSING_FAILED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                SESSION_ALREADY_ACTIVE:
                  $ref: "#/components/examples/SESSION_ALREADY_ACTIVE"
                EVENT_CLOSED:
                  $ref: "#/components/examples/EVENT_CLOSED"
                EVENT_CLOSING_FAILED:
                  $ref: "#/components/examples/EVENT_CLOSING_FAILED"
        "413":
          description: "`PAYLOAD_TOO_LARGE`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                PAYLOAD_TOO_LARGE:
                  $ref: "#/components/examples/PAYLOAD_TOO_LARGE"
        "422":
          description: "`VALIDATION_FAILED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_FAILED:
                  $ref: "#/components/examples/VALIDATION_FAILED"
  /api/controller/sessions/active:
    get:
      operationId: getActiveSession
      summary: API 5 · Dashboard state (Controller hydrate)
      description: >-
        Full dashboard hydrate, called on load and on every socket reconnect. `session` is null in the Setup screen,
        with winners still listed.

        This is the only payload family that may contain `fullName`, `entranceId` and `rubric`.
      tags:
        - Controller
        - Hydrate
      x-api: 5
      x-owner:
        story: BE-08
        engineer: Asmita
      security:
        - controllerToken: []
      responses:
        "200":
          description: Dashboard state.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControllerDashboard"
              example:
                serverNow: "2026-12-05T10:00:00.000Z"
                eventDay:
                  id: evt_01
                  status: OPEN
                  confirmedCount: 1
                  csvExportedAt: null
                  csvUpToDate: false
                  lastSettings:
                    capacity: 5
                    roundDurationSeconds: 90
                  winners:
                    - roundNumber: 1
                      fullName: Dev Khan
                      score: 100
                session:
                  id: ses_01
                  phase: READY
                  capacity: 5
                  roundDurationSeconds: 90
                  joinedCount: 5
                slots:
                  - slotNumber: 1
                    code: "29"
                    shape: BLUE_CIRCLE
                    slotState: LOBBY
                    player:
                      id: ply_1
                      label: Neha
                      fullName: Neha Rao
                      entranceId: DF-2026-2802
                      connection: CONNECTED
                      bestScore: null
                      nameReview: APPROVED
                treasure:
                  candidateId: cnd_1
                  status: APPROVED
                  title: The Saffron Vault
                  backstory: A vault of saffron guarded by a sleepy parrot. (A simulated treasure.)
                  lockObjective: Convince the parrot to open the vault.
                  imageUrl: https://storage.googleapis.com/bucket/cnd_1.jpg?signature=abc
                  filterPassed: true
                  rubric:
                    version: v1
                    scoringCriteria:
                      - Requests a poem
                round:
                  roundId: rnd_1
                  roundNumber: 1
                  durationSeconds: 90
                  startedAt: null
                  roundEndAt: null
                audit:
                  - at: "2026-12-05T10:00:00.000Z"
                    summary: Session opened - 5 players - 90s round
        "401":
          description: "`UNAUTHENTICATED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  $ref: "#/components/examples/UNAUTHENTICATED"
  /api/controller/sessions/{id}/duration:
    patch:
      operationId: changeRoundDuration
      summary: API 6 · Change round duration
      description: |-
        Allowed in `JOINING`, `TREASURE_REVIEW`, `READY`. Locked at start. Positive whole seconds, no maximum.
        The Controller UI steps in 20 seconds (D14); the server only requires a positive whole number.
      tags:
        - Controller
      x-api: 6
      x-owner:
        story: BE-09
        engineer: Asmita
      security:
        - controllerToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Session ID.
          schema:
            type: string
          example: ses_01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roundDurationSeconds
              properties:
                roundDurationSeconds:
                  type: integer
                  examples:
                    - 120
                  minimum: 1
      responses:
        "200":
          description: Duration changed.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                properties:
                  session:
                    type: object
                    required:
                      - id
                      - roundDurationSeconds
                    properties:
                      id:
                        type: string
                        examples:
                          - ses_01
                      roundDurationSeconds:
                        type: integer
                        examples:
                          - 120
              example:
                session:
                  id: ses_01
                  roundDurationSeconds: 120
        "400":
          description: "`BAD_REQUEST`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                BAD_REQUEST:
                  $ref: "#/components/examples/BAD_REQUEST"
        "401":
          description: "`UNAUTHENTICATED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  $ref: "#/components/examples/UNAUTHENTICATED"
        "409":
          description: "`INVALID_PHASE` · `EVENT_CLOSING_FAILED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_PHASE:
                  $ref: "#/components/examples/INVALID_PHASE"
                EVENT_CLOSING_FAILED:
                  $ref: "#/components/examples/EVENT_CLOSING_FAILED"
        "413":
          description: "`PAYLOAD_TOO_LARGE`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                PAYLOAD_TOO_LARGE:
                  $ref: "#/components/examples/PAYLOAD_TOO_LARGE"
        "422":
          description: "`VALIDATION_FAILED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_FAILED:
                  $ref: "#/components/examples/VALIDATION_FAILED"
  /api/controller/sessions/{id}/treasure:
    post:
      operationId: generateTreasure
      summary: API 7 · Generate a treasure
      description: >-
        Asynchronous: text and image generation can take 20 to 40 seconds. Needs all players joined.

        Moves `JOINING` to `TREASURE_REVIEW`. No request body. The result arrives on `treasure:ready` or
        `treasure:failed`.
      tags:
        - Controller
      x-api: 7
      x-owner:
        story: BE-19
        engineer: Shreya
      security:
        - controllerToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Session ID.
          schema:
            type: string
          example: ses_01
      responses:
        "202":
          description: Generation started.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                type: object
                required:
                  - candidate
                properties:
                  candidate:
                    $ref: "#/components/schemas/CandidateRef"
              example:
                candidate:
                  candidateId: cnd_1
                  status: GENERATING
        "401":
          description: "`UNAUTHENTICATED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  $ref: "#/components/examples/UNAUTHENTICATED"
        "409":
          description: "`PLAYERS_NOT_JOINED` · `INVALID_PHASE` · `GENERATION_IN_PROGRESS` · `EVENT_CLOSING_FAILED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                PLAYERS_NOT_JOINED:
                  $ref: "#/components/examples/PLAYERS_NOT_JOINED"
                INVALID_PHASE:
                  $ref: "#/components/examples/INVALID_PHASE"
                GENERATION_IN_PROGRESS:
                  $ref: "#/components/examples/GENERATION_IN_PROGRESS"
                EVENT_CLOSING_FAILED:
                  $ref: "#/components/examples/EVENT_CLOSING_FAILED"
  /api/controller/treasure/{id}/approve:
    post:
      operationId: approveTreasure
      summary: API 8 · Approve the treasure
      description: |-
        Pins the treasure, rubric version and image. Immutable from here. Phase becomes `READY`. No request body.
        Refused without a stored image (D7).
      tags:
        - Controller
      x-api: 8
      x-owner:
        story: BE-19
        engineer: Shreya
      security:
        - controllerToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Treasure candidate ID.
          schema:
            type: string
          example: cnd_1
      responses:
        "200":
          description: Approved.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                  - treasure
                properties:
                  session:
                    type: object
                    required:
                      - id
                      - phase
                    properties:
                      id:
                        type: string
                        examples:
                          - ses_01
                      phase:
                        $ref: "#/components/schemas/Phase"
                        examples:
                          - READY
                  treasure:
                    type: object
                    required:
                      - candidateId
                      - status
                    properties:
                      candidateId:
                        type: string
                        examples:
                          - cnd_1
                      status:
                        $ref: "#/components/schemas/CandidateStatus"
                        examples:
                          - APPROVED
              example:
                session:
                  id: ses_01
                  phase: READY
                treasure:
                  candidateId: cnd_1
                  status: APPROVED
        "401":
          description: "`UNAUTHENTICATED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  $ref: "#/components/examples/UNAUTHENTICATED"
        "404":
          description: "`NOT_FOUND`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                NOT_FOUND:
                  $ref: "#/components/examples/NOT_FOUND"
        "409":
          description: "`CANDIDATE_NOT_READY` · `INVALID_PHASE` · `EVENT_CLOSING_FAILED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                CANDIDATE_NOT_READY:
                  $ref: "#/components/examples/CANDIDATE_NOT_READY"
                INVALID_PHASE:
                  $ref: "#/components/examples/INVALID_PHASE"
                EVENT_CLOSING_FAILED:
                  $ref: "#/components/examples/EVENT_CLOSING_FAILED"
  /api/controller/treasure/{id}/reject:
    post:
      operationId: rejectTreasure
      summary: API 9 · Reject and regenerate
      description: "One action (D32): marks the candidate rejected and starts a new one. No request body."
      tags:
        - Controller
      x-api: 9
      x-owner:
        story: BE-19
        engineer: Shreya
      security:
        - controllerToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Treasure candidate ID.
          schema:
            type: string
          example: cnd_1
      responses:
        "202":
          description: Rejected; new candidate generating.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                type: object
                required:
                  - rejectedCandidateId
                  - candidate
                properties:
                  rejectedCandidateId:
                    type: string
                    examples:
                      - cnd_1
                  candidate:
                    $ref: "#/components/schemas/CandidateRef"
              example:
                rejectedCandidateId: cnd_1
                candidate:
                  candidateId: cnd_2
                  status: GENERATING
        "401":
          description: "`UNAUTHENTICATED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  $ref: "#/components/examples/UNAUTHENTICATED"
        "404":
          description: "`NOT_FOUND`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                NOT_FOUND:
                  $ref: "#/components/examples/NOT_FOUND"
        "409":
          description: "`INVALID_PHASE` · `EVENT_CLOSING_FAILED`"
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_PHASE:
                  $ref: "#/components/examples/INVALID_PHASE"
                EVENT_CLOSING_FAILED:
                  $ref: "#/components/examples/EVENT_CLOSING_FAILED"
